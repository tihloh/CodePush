name: CodePush stable Android release

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codepush-stable-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Determine release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          CODE=$(sed -n 's/^[[:space:]]*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid stable versionName: $VERSION"; exit 1; }
          [[ "$CODE" =~ ^[0-9]+$ ]] || { echo "Invalid versionCode"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists. Increment versionName and versionCode for the next stable release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Validate stable release signing secrets
        if: steps.version.outputs.exists == 'false'
        env:
          KEYSTORE_B64: ${{ secrets.CODEPUSH_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CODEPUSH_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CODEPUSH_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CODEPUSH_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$KEYSTORE_B64" ]] || missing+=(CODEPUSH_KEYSTORE_BASE64)
          [[ -n "$STORE_PASSWORD" ]] || missing+=(CODEPUSH_KEYSTORE_PASSWORD)
          [[ -n "$KEY_ALIAS" ]] || missing+=(CODEPUSH_KEY_ALIAS)
          [[ -n "$KEY_PASSWORD" ]] || missing+=(CODEPUSH_KEY_PASSWORD)
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing GitHub Actions repository secrets: %s\\n' "${missing[*]}"
            echo "Configure them under Settings > Secrets and variables > Actions and launch a NEW run."
            exit 1
          fi
          if ! printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/codepush-release.jks"; then
            echo "::error::CODEPUSH_KEYSTORE_BASE64 is not valid base64."
            exit 1
          fi
          test -s "$RUNNER_TEMP/codepush-release.jks" || { echo "::error::Decoded signing keystore is empty."; exit 1; }
          chmod 600 "$RUNNER_TEMP/codepush-release.jks"
          if ! keytool -list -keystore "$RUNNER_TEMP/codepush-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Signing keystore cannot be opened with the configured password and alias."
            exit 1
          fi

      - name: Run Android unit tests
        if: steps.version.outputs.exists == 'false'
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build signed stable APK
        if: steps.version.outputs.exists == 'false'
        env:
          CODEPUSH_KEYSTORE_PATH: ${{ runner.temp }}/codepush-release.jks
          CODEPUSH_KEYSTORE_PASSWORD: ${{ secrets.CODEPUSH_KEYSTORE_PASSWORD }}
          CODEPUSH_KEY_ALIAS: ${{ secrets.CODEPUSH_KEY_ALIAS }}
          CODEPUSH_KEY_PASSWORD: ${{ secrets.CODEPUSH_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bash ./gradlew --no-daemon :app:assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          cp "$APK" "CodePush-${{ steps.version.outputs.version }}.apk"
          sha256sum "CodePush-${{ steps.version.outputs.version }}.apk" > "CodePush-${{ steps.version.outputs.version }}.apk.sha256"

      - name: Publish stable GitHub release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v$VERSION" "CodePush-$VERSION.apk" "CodePush-$VERSION.apk.sha256" \
            --target "$GITHUB_SHA" \
            --title "CodePush v$VERSION" \
            --latest \
            --generate-notes

      - name: Remove signing key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/codepush-release.jks"
